<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Management - MANAGERIUM POS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="theme-light">

<div class="kitchen-standalone">

    <!-- TOP BAR -->
    <div class="kitchen-topbar">
        <div class="kitchen-topbar-brand">MANAGERIUM <span>KITCHEN</span></div>
        <button class="kitchen-topbar-back" onclick="window.location='index.html'">
            <i data-lucide="arrow-left"></i> Back to POS
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="kitchen-main">
        <h1 class="kitchen-page-title">
            <i data-lucide="cooking-pot"></i> Kitchen Management
        </h1>

        <!-- FILTERS BAR -->
        <div class="kitchen-filters-bar">
            <div class="kitchen-filter-group">
                <label>Office</label>
                <select id="filterOffice" onchange="applyFilters()">
                    <option value="">All</option>
                </select>
            </div>
            <div class="kitchen-filter-group">
                <label>Warehouse</label>
                <select id="filterWarehouse" onchange="applyFilters()">
                    <option value="">All</option>
                </select>
            </div>
            <div class="kitchen-filter-group">
                <label>Status</label>
                <select id="filterStatus" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
            <button class="btn-kitchen-view" onclick="applyFilters()">View</button>
            
<button class="btn-kitchen-view" onclick="testPrintKOT()" style="margin-right: 10px;"><i data-lucide="printer" style="width:14px;height:14px;margin-right:5px;vertical-align:middle;"></i> Test Print KOT</button>
<button class="btn-kitchen-new" onclick="openCreateModal()">+ Create New Kitchen</button>

        </div>

        <!-- TABLE -->
        <div class="kitchen-table-wrap">
            <table class="kitchen-table">
                <thead>
                    <tr>
                        <th style="width:50px;text-align:center">SL.</th>
                        <th>Office Name</th>
                        <th>Warehouse Name</th>
                        <th>Kitchen Name</th>
                        <th style="width:150px; text-align:center;">Total Assigned Items</th>
                        <th>Status</th>
                        <th style="text-align:center;width:160px">Action</th>
                    </tr>
                </thead>
                <tbody id="kitchenTableBody">
                    <!-- Rendered by JS -->
                </tbody>
            </table>
            <div class="kitchen-pagination">
                <span>Rows per page:</span>
                <select><option>15</option><option>25</option><option>50</option></select>
                <span id="paginationText">1-0 of 0</span>
                <button class="kitchen-page-arrow" disabled>&lt;</button>
                <button class="kitchen-page-arrow" disabled>&gt;</button>
            </div>
        </div>
    </div>
</div>


<!-- ITEMS MODAL -->
<div class="kitchen-modal-overlay" id="itemsModalOverlay">
    <div class="kitchen-modal" style="width: 800px; max-width: 95vw; height: 80vh; display: flex; flex-direction: column;">
        <div class="kitchen-modal-header">
            <h2 id="itemsModalTitle">Assign Items</h2>
            <button class="kitchen-modal-close" onclick="closeItemsModal()">&times;</button>
        </div>
        <div class="kitchen-modal-body" style="flex: 1; display: flex; flex-direction: row; gap: 20px; overflow: hidden;">
            <input type="hidden" id="itemsKitchenId">
            <input type="hidden" id="itemsWarehouseId">
            
            <div style="flex: 1; display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 8px;">
                <div style="padding: 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 700;">AVAILABLE ITEMS</div>
                <div style="padding: 10px; border-bottom: 1px solid #e2e8f0;">
                    <input type="text" id="searchAvailable" oninput="renderAvailableItems()" placeholder="Search items..." style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>
                <div id="availableItemsList" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
                <div style="padding: 10px; border-top: 1px solid #e2e8f0; text-align: right;">
                    <button class="btn-kitchen-view" onclick="assignSelectedItems()">Add Selected &rarr;</button>
                </div>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 8px;">
                <div style="padding: 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 700;">ASSIGNED ITEMS (<span id="assignedCount">0</span>)</div>
                <div style="padding: 10px; border-bottom: 1px solid #e2e8f0;">
                    <input type="text" id="searchAssigned" oninput="renderAssignedItems()" placeholder="Search items..." style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>
                <div id="assignedItemsList" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
                <div style="padding: 10px; border-top: 1px solid #e2e8f0;">
                    <button class="btn-modal-cancel" onclick="removeSelectedItems()">&larr; Remove Selected</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CREATE / EDIT MODAL -->
<div class="kitchen-modal-overlay" id="kitchenModalOverlay">
    <div class="kitchen-modal">
        <div class="kitchen-modal-header">
            <h2 id="modalTitle">Create New Kitchen</h2>
            <button class="kitchen-modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="kitchen-modal-body">
            <input type="hidden" id="editingId">
            <div class="kitchen-form-group">
                <label>Office</label>
                <select id="modalOffice" onchange="populateModalWarehouse()">
                    <option value="">-- Select Office --</option>
                </select>
            </div>
            <div class="kitchen-form-group">
                <label>Warehouse</label>
                <select id="modalWarehouse">
                    <option value="">-- Select Warehouse --</option>
                </select>
            </div>
            <div class="kitchen-form-group">
                <label>Kitchen Name</label>
                <input type="text" id="modalKitchenName" placeholder="e.g. Bangla Kitchen, Chinese Kitchen...">
            </div>
            <div class="kitchen-form-group">
                <label>Status</label>
                <select id="modalStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
        <div class="kitchen-modal-footer">
            <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-modal-save" onclick="saveKitchen()">Save Kitchen</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// ── DATA ───────────────────────────────────────────────────────────────────
// Use global RESTAURANT_DATA loaded from data.js
const DATA = RESTAURANT_DATA;


let nextId = 4;

// ── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    populateFilterDropdowns();
    renderTable(DATA.kitchens);
    lucide.createIcons();
});

function populateFilterDropdowns() {
    const offSel = document.getElementById('filterOffice');
    DATA.offices.forEach(o => {
        offSel.innerHTML += `<option value="${o.id}">${o.name}</option>`;
    });
    offSel.value = '';

    const whSel = document.getElementById('filterWarehouse');
    DATA.warehouses.forEach(w => {
        whSel.innerHTML += `<option value="${w.id}">${w.name}</option>`;
    });
    whSel.value = '';
}

function getOfficeName(id)    { return (DATA.offices.find(o => o.id === id)    || {}).name || '-'; }
function getWarehouseName(id) { return (DATA.warehouses.find(w => w.id === id) || {}).name || '-'; }

// ── FILTER ────────────────────────────────────────────────────────────────
function applyFilters() {
    const office    = document.getElementById('filterOffice').value;
    const warehouse = document.getElementById('filterWarehouse').value;
    const status    = document.getElementById('filterStatus').value;

    const filtered = DATA.kitchens.filter(k => {
        return (!office    || k.officeId    === office)
            && (!warehouse || k.warehouseId === warehouse)
            && (!status    || k.status      === status);
    });
    renderTable(filtered);
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────
function renderTable(rows) {
    const tbody = document.getElementById('kitchenTableBody');
    document.getElementById('paginationText').textContent = `1-${rows.length} of ${rows.length}`;

    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#94a3b8;font-weight:600;">No kitchens found</td></tr>';
        return;
    }

    tbody.innerHTML = rows.map((k, i) => `
        <tr>
            <td style="text-align:center;font-weight:700;color:#64748b">${i + 1}</td>
            <td>${getOfficeName(k.officeId)}</td>
            <td>${getWarehouseName(k.warehouseId)}</td>
            <td style="font-weight:700;color:#0f172a">${k.name}</td>
            <td style="text-align:center">${k.assignedItems}</td>
            <td>
<label class="switch" style="position: relative; display: inline-block; width: 44px; height: 22px;">
    <input type="checkbox" ${k.status === 'Active' ? 'checked' : ''} onchange="toggleKitchenStatus(${k.id}, this.checked)" style="opacity: 0; width: 0; height: 0;">
    <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: ${k.status === 'Active' ? '#10b981' : '#cbd5e1'}; border-radius: 22px; transition: .4s;">
        <span style="position: absolute; content: ''; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .4s; transform: ${k.status === 'Active' ? 'translateX(22px)' : 'translateX(0)'};"></span>
    </span>
</label>
<span style="font-size: 11px; font-weight: 700; margin-left: 6px; color: ${k.status === 'Active' ? '#10b981' : '#64748b'};">${k.status}</span>
</td>
            <td>
                <div class="kitchen-action-btns" style="justify-content:center">
                    <button class="btn-kitchen-edit"  onclick="openEditModal(${k.id})">Edit</button>
                    
<button class="btn-kitchen-items" onclick="openItemsModal(${k.id})">Items</button>
<button class="btn-modal-cancel" style="padding: 5px 12px; font-size: 12px; background: #fee2e2; color: #dc2626;" onclick="deleteKitchen(${k.id})">Delete</button>

                </div>
            </td>
        </tr>
    `).join('');
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openCreateModal() {
    document.getElementById('modalTitle').textContent = 'Create New Kitchen';
    document.getElementById('editingId').value = '';
    document.getElementById('modalKitchenName').value = '';
    document.getElementById('modalStatus').value = 'Active';
    populateModalOffice('');
    document.getElementById('kitchenModalOverlay').classList.add('active');
    lucide.createIcons();
}

function openEditModal(id) {
    const k = DATA.kitchens.find(k => k.id === id);
    if (!k) return;
    document.getElementById('modalTitle').textContent = 'Edit Kitchen';
    document.getElementById('editingId').value = id;
    document.getElementById('modalKitchenName').value = k.name;
    document.getElementById('modalStatus').value = k.status;
    populateModalOffice(k.officeId);
    populateModalWarehouse(k.warehouseId);
    document.getElementById('kitchenModalOverlay').classList.add('active');
    lucide.createIcons();
}

function closeModal() {
    document.getElementById('kitchenModalOverlay').classList.remove('active');
}

function populateModalOffice(selectedId) {
    const sel = document.getElementById('modalOffice');
    sel.innerHTML = '<option value="">-- Select Office --</option>';
    DATA.offices.forEach(o => {
        sel.innerHTML += `<option value="${o.id}" ${o.id === selectedId ? 'selected' : ''}>${o.name}</option>`;
    });
    populateModalWarehouse('');
}

function populateModalWarehouse(selectedId) {
    const officeId = document.getElementById('modalOffice').value;
    const sel = document.getElementById('modalWarehouse');
    sel.innerHTML = '<option value="">-- Select Warehouse --</option>';
    DATA.warehouses
        .filter(w => !officeId || w.officeId === officeId)
        .forEach(w => {
            sel.innerHTML += `<option value="${w.id}" ${w.id === selectedId ? 'selected' : ''}>${w.name}</option>`;
        });
}

function saveKitchen() {
    const editId = document.getElementById('editingId').value;
    const officeId = document.getElementById('modalOffice').value;
    const warehouseId = document.getElementById('modalWarehouse').value;
    const name = document.getElementById('modalKitchenName').value.trim();
    const status = document.getElementById('modalStatus').value;

    if (!officeId || !warehouseId || !name) {
        alert('Please fill in Office, Warehouse, and Kitchen Name.');
        return;
    }

    // Uniqueness check: same name in same warehouse
    const duplicate = DATA.kitchens.find(k => 
        k.warehouseId === warehouseId && 
        k.name.toLowerCase() === name.toLowerCase() && 
        (!editId || k.id !== parseInt(editId))
    );
    if (duplicate) {
        alert(`A kitchen named "${name}" already exists in this warehouse.`);
        return;
    }

    if (editId) {
        const k = DATA.kitchens.find(k => k.id === parseInt(editId));
        if (k) { k.officeId = officeId; k.warehouseId = warehouseId; k.name = name; k.status = status; }
    } else {
        DATA.kitchens.push({ id: nextId++, officeId, warehouseId, name, status, assignedItems: 0 });
    }

    closeModal();
    applyFilters();
        if (window.saveKitchenData) window.saveKitchenData();
}

// Close modal on overlay click
document.getElementById('kitchenModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// --- ITEMS MODAL LOGIC ---
function openItemsModal(kitchenId) {
    const k = DATA.kitchens.find(k => k.id === kitchenId);
    if (!k) return;
    document.getElementById('itemsModalTitle').textContent = 'Assign Items - ' + k.name + ' (' + getWarehouseName(k.warehouseId) + ')';
    document.getElementById('itemsKitchenId').value = k.id;
    document.getElementById('itemsWarehouseId').value = k.warehouseId;
    document.getElementById('searchAvailable').value = '';
    document.getElementById('searchAssigned').value = '';
    
    renderAvailableItems();
    renderAssignedItems();
    
    document.getElementById('itemsModalOverlay').classList.add('active');
}

function closeItemsModal() {
    document.getElementById('itemsModalOverlay').classList.remove('active');
    applyFilters();
        if (window.saveKitchenData) window.saveKitchenData(); 
}

function renderAvailableItems() {
    const kitchenId = parseInt(document.getElementById('itemsKitchenId').value);
    const warehouseId = document.getElementById('itemsWarehouseId').value;
    const search = document.getElementById('searchAvailable').value.toLowerCase();
    
    const available = DATA.products.filter(p => {
        if (!p.is_kitchen) return false;
        if (search && !p.name.toLowerCase().includes(search)) return false;
        
        const mapping = DATA.kitchenItemMappings.find(m => m.warehouseId === warehouseId && m.itemId === p.id);
        return !mapping;
    });
    
    const list = document.getElementById('availableItemsList');
    list.innerHTML = available.map(p => `<div style="display: flex; align-items: center; padding: 6px; border-bottom: 1px solid #f1f5f9;"><input type="checkbox" class="chk-available" value="${p.id}" style="margin-right: 8px;"> ${p.name} (${p.code})</div>`).join('');
}

function renderAssignedItems() {
    const kitchenId = parseInt(document.getElementById('itemsKitchenId').value);
    const warehouseId = document.getElementById('itemsWarehouseId').value;
    const search = document.getElementById('searchAssigned').value.toLowerCase();
    
    const mappings = DATA.kitchenItemMappings.filter(m => m.kitchenId === kitchenId && m.warehouseId === warehouseId);
    const assigned = mappings.map(m => DATA.products.find(p => p.id === m.itemId)).filter(p => p);
    
    const filtered = assigned.filter(p => !search || p.name.toLowerCase().includes(search));
    
    document.getElementById('assignedCount').textContent = assigned.length;
    
    const list = document.getElementById('assignedItemsList');
    list.innerHTML = filtered.map(p => `<div style="display: flex; align-items: center; padding: 6px; border-bottom: 1px solid #f1f5f9;"><input type="checkbox" class="chk-assigned" value="${p.id}" style="margin-right: 8px;"> ${p.name} (${p.code})  <button onclick="removeSingleItem(${p.id})" style="margin-left: auto; border:none; background:transparent; color:#dc2626; cursor:pointer;">&times;</button></div>`).join('');
}

function assignSelectedItems() {
    const kitchenId = parseInt(document.getElementById('itemsKitchenId').value);
    const warehouseId = document.getElementById('itemsWarehouseId').value;
    const checkboxes = document.querySelectorAll('.chk-available:checked');
    
    checkboxes.forEach(cb => {
        const itemId = parseInt(cb.value);
        DATA.kitchenItemMappings.push({ kitchenId, warehouseId, itemId });
    });
    
    renderAvailableItems();
    renderAssignedItems();
    if (window.saveKitchenData) window.saveKitchenData();
}

function removeSelectedItems() {
    const kitchenId = parseInt(document.getElementById('itemsKitchenId').value);
    const warehouseId = document.getElementById('itemsWarehouseId').value;
    const checkboxes = document.querySelectorAll('.chk-assigned:checked');
    
    const idsToRemove = Array.from(checkboxes).map(cb => parseInt(cb.value));
    
    DATA.kitchenItemMappings = DATA.kitchenItemMappings.filter(m => 
        !(m.kitchenId === kitchenId && m.warehouseId === warehouseId && idsToRemove.includes(m.itemId))
    );
    
    renderAvailableItems();
    renderAssignedItems();
    if (window.saveKitchenData) window.saveKitchenData();
}

function removeSingleItem(itemId) {
    const kitchenId = parseInt(document.getElementById('itemsKitchenId').value);
    const warehouseId = document.getElementById('itemsWarehouseId').value;
    
    DATA.kitchenItemMappings = DATA.kitchenItemMappings.filter(m => 
        !(m.kitchenId === kitchenId && m.warehouseId === warehouseId && m.itemId === itemId)
    );
    
    renderAvailableItems();
    renderAssignedItems();
    if (window.saveKitchenData) window.saveKitchenData();
}

function toggleKitchenStatus(id, isActive) {
    const k = DATA.kitchens.find(k => k.id === id);
    if (k) {
        k.status = isActive ? 'Active' : 'Inactive';
        applyFilters();
        if (window.saveKitchenData) window.saveKitchenData();
    }
}

function deleteKitchen(id) {
    const k = DATA.kitchens.find(k => k.id === id);
    if (!k) return;
    
    const assignedCount = DATA.kitchenItemMappings.filter(m => m.kitchenId === id).length;
    if (assignedCount > 0) {
        alert('Cannot delete kitchen because it has ' + assignedCount + ' assigned items. Please remove items first.');
        return;
    }
    
    if (confirm('Are you sure you want to delete kitchen "' + k.name + '"?')) {
        DATA.kitchens = DATA.kitchens.filter(k => k.id !== id);
        applyFilters();
        if (window.saveKitchenData) window.saveKitchenData();
    }
}

const origApplyFilters = applyFilters;
applyFilters = function() {
    DATA.kitchens.forEach(k => {
        k.assignedItems = DATA.kitchenItemMappings.filter(m => m.kitchenId === k.id).length;
    });
    origApplyFilters();
};

// --- INLINE PRINT ENGINE FOR STANDALONE KITCHEN PAGE ---
function getPrintPageWrapperKitchen(contentHtml, title = "Receipt") {
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${title}</title>
<style>
    @page { size: 68mm auto; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #f1f5f9; display: flex; justify-content: center; padding: 20px 0; }
    body {
        width: 68mm; max-width: 68mm; margin: 0 auto; padding: 10px;
        background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        font-family: 'Courier New', Courier, monospace; font-size: 11px; color: #000; line-height: 1.3;
    }
    @media print {
        html { background: #ffffff; padding: 0; display: block; }
        body { box-shadow: none; padding: 2px 4px; width: 68mm; max-width: 68mm; margin: 0; }
    }
    .ticket-container { width: 100%; margin-bottom: 15px; border-bottom: 2px dashed #000; padding-bottom: 12px; page-break-after: always; }
    .ticket-container:last-child { border-bottom: none; page-break-after: avoid; }
    .watermark-banner { border: 2px solid #000; background: #000; color: #fff; text-align: center; font-weight: 900; font-size: 11px; padding: 4px 0; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .watermark-box-warning { border: 1.5px dashed #000; text-align: center; font-size: 10px; font-weight: 900; padding: 4px; margin: 8px 0 4px 0; text-transform: uppercase; }
    .header-brand { text-align: center; font-size: 14px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
    .header-sub { text-align: center; font-size: 9px; margin-bottom: 6px; }
    .table-banner { background: #000; color: #fff; text-align: center; font-size: 14px; font-weight: 900; padding: 4px 0; margin: 6px 0; letter-spacing: 0.5px; }
    .ticket-type-badge { text-align: center; font-weight: 800; font-size: 10px; margin: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .meta-line { display: flex; justify-content: space-between; font-size: 10px; margin: 2px 0; }
    .divider { border-top: 1px dashed #000; margin: 6px 0; }
    table.items-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.items-table th { font-size: 10px; text-transform: uppercase; border-bottom: 1px solid #000; padding: 3px 0; text-align: left; }
    table.items-table td { padding: 4px 0; border-bottom: 1px dotted #aaa; font-size: 11px; vertical-align: top; }
    .col-qty { width: 35px; text-align: right; font-weight: bold; }
    .item-title { font-weight: bold; }
    .item-badge-new { font-size: 9px; background: #000; color: #fff; padding: 1px 3px; border-radius: 2px; margin-left: 4px; }
</style>
</head>
<body>
${contentHtml}
</body>
</html>`;
}

function openPrintDialogKitchen(htmlContent) {
    const printWindow = window.open('', '_blank');
    if (printWindow) {
        printWindow.document.write(htmlContent);
        printWindow.document.close();
        setTimeout(() => {
            printWindow.focus();
            printWindow.print();
        }, 500);
    } else {
        alert('Popup blocked! Please allow popups for printing.');
    }
}

function generateTicketHTMLKitchen(orderId, title, items, tableNumber, ticketTag = 'KOT', isReprint = false) {
    const nowStr = new Date().toLocaleString();
    let totalQty = items.reduce((sum, i) => sum + i.qty, 0);

    let html = `<div class="ticket-container">
        ${isReprint ? '<div class="watermark-banner">★ DUPLICATE COPY ★</div>' : ''}
        <div class="header-brand">${title}</div>
        <div class="ticket-type-badge">*** ${ticketTag.toUpperCase()} ***</div>
        <div class="table-banner">TABLE: ${tableNumber.toUpperCase()}</div>
        <div class="meta-line"><span>Order: <strong>${orderId}</strong></span><span>Time: ${nowStr}</span></div>
        <div class="divider"></div>
        <table class="items-table">
            <thead><tr><th>Item Description</th><th class="col-qty">QTY</th></tr></thead>
            <tbody>`;

    items.forEach(item => {
        html += `<tr>
            <td><span class="item-title">[ ${item.qty}x ] ${item.name}</span></td>
            <td class="col-qty" style="font-size: 14px;">${item.qty}</td>
        </tr>`;
    });

    html += `</tbody></table>
        <div class="divider"></div>
        <div class="meta-line"><span>Total Items: <strong>${items.length}</strong></span><span>Total Qty: <strong>${totalQty}</strong></span></div>
        ${isReprint ? '<div class="watermark-box-warning">[ DUPLICATE TOKEN COPY ]</div>' : ''}
    </div>`;
    return html;
}

function testPrintKOT() {
    const orderItems = DATA.products.slice(0, 5).map((p, idx) => ({
        ...p,
        qty: idx % 2 === 0 ? 2 : 1,
        printedQty: 0
    }));

    // Group items by kitchen mapping
    const bucketA = [];
    const bucketsB = {};
    const bucketC = [];
    const warehouseId = 'W1';

    orderItems.forEach(item => {
        if (!item.is_kitchen) {
            bucketA.push(item);
        } else {
            const mapping = DATA.kitchenItemMappings.find(m => m.warehouseId === warehouseId && m.itemId === item.id);
            if (mapping) {
                const k = DATA.kitchens.find(k => k.id === mapping.kitchenId);
                if (k && k.status === 'Active') {
                    if (!bucketsB[k.id]) bucketsB[k.id] = { kitchenName: k.name, items: [] };
                    bucketsB[k.id].items.push(item);
                } else {
                    bucketC.push(item);
                }
            } else {
                bucketC.push(item);
            }
        }
    });

    let ticketsHtml = '';
    if (bucketA.length > 0) {
        ticketsHtml += generateTicketHTMLKitchen('INV-TEST-001', 'KOT - COUNTER / BAR', bucketA, 'T-01 (TEST)', 'TEST KOT');
    }
    Object.values(bucketsB).forEach(b => {
        if (b.items.length > 0) {
            ticketsHtml += generateTicketHTMLKitchen('INV-TEST-001', 'KOT - ' + b.kitchenName, b.items, 'T-01 (TEST)', 'TEST KOT');
        }
    });
    if (bucketC.length > 0) {
        ticketsHtml += generateTicketHTMLKitchen('INV-TEST-001', 'KOT - UNMAPPED ITEMS', bucketC, 'T-01 (TEST)', 'TEST KOT');
    }

    if (!ticketsHtml) {
        ticketsHtml = generateTicketHTMLKitchen('INV-TEST-001', 'KOT - TEST PRINT', orderItems, 'T-01 (TEST)', 'TEST KOT');
    }

    const fullPageHtml = getPrintPageWrapperKitchen(ticketsHtml, 'KOT Test Print');
    openPrintDialogKitchen(fullPageHtml);
}
